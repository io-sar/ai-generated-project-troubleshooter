# Runs every check on each push and pull request. Needs no API key.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Lint, types, imports and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv and the Python version in .python-version.
      - uses: astral-sh/setup-uv@v10

      # --locked fails if uv.lock is out of step with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Mypy
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -q

      # Streamlit Cloud installs from requirements.txt, so it must match uv.lock.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --format=requirements-txt --no-dev --no-hashes --output-file=requirements.txt
          git diff --exit-code requirements.txt

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # Full history, so every commit in the push or pull request is scanned.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report in the job log only; posting PR comments would need write access.
          GITLEAKS_ENABLE_COMMENTS: false
