[project]
name = "ai-project-troubleshooter"
version = "0.1.0.dev0"
description = "Assesses a troubled project and produces a recovery pack."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshooter"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes. I: import order. B: likely bugs. UP: modern syntax.
# SIM: simpler code. S: security checks. RUF: ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert statements.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
