[project]
name = "ai-project-troubleshooter"
version = "0.1.0.dev0"
description = "Assesses a troubled project and produces a recovery pack."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.3",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.16",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshooter"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W/F: pycodestyle and pyflakes. I: import order. B: likely bugs. UP: modern syntax.
# SIM: simpler code. S: security checks. RUF: ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain assert statements.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests", "app_pages", "streamlit_app.py"]

# Enforces the one-way module dependencies set out in CLAUDE.md. Run with: uv run lint-imports
[tool.importlinter]
root_package = "troubleshooter"

[[tool.importlinter.contracts]]
name = "domain imports no other project package"
type = "forbidden"
source_modules = ["troubleshooter.domain"]
forbidden_modules = [
    "troubleshooter.llm",
    "troubleshooter.i18n",
    "troubleshooter.engines",
    "troubleshooter.export",
    "troubleshooter.ui",
]

[[tool.importlinter.contracts]]
name = "llm imports no other project package"
type = "forbidden"
source_modules = ["troubleshooter.llm"]
forbidden_modules = [
    "troubleshooter.domain",
    "troubleshooter.i18n",
    "troubleshooter.engines",
    "troubleshooter.export",
    "troubleshooter.ui",
]

[[tool.importlinter.contracts]]
name = "i18n imports no other project package"
type = "forbidden"
source_modules = ["troubleshooter.i18n"]
forbidden_modules = [
    "troubleshooter.domain",
    "troubleshooter.llm",
    "troubleshooter.engines",
    "troubleshooter.export",
    "troubleshooter.ui",
]

[[tool.importlinter.contracts]]
name = "engines import only llm and domain"
type = "forbidden"
source_modules = ["troubleshooter.engines"]
forbidden_modules = ["troubleshooter.i18n", "troubleshooter.export", "troubleshooter.ui"]

[[tool.importlinter.contracts]]
name = "export imports only i18n and domain"
type = "forbidden"
source_modules = ["troubleshooter.export"]
forbidden_modules = ["troubleshooter.llm", "troubleshooter.engines", "troubleshooter.ui"]

[[tool.importlinter.contracts]]
name = "ui imports only engines, export, i18n and domain"
type = "forbidden"
source_modules = ["troubleshooter.ui"]
forbidden_modules = ["troubleshooter.llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
