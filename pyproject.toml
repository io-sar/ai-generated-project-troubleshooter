[project]
name = "ai-project-troubleshooter"
version = "0.1.0.dev0"
description = "Assesses a troubled project and produces a recovery pack."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/troubleshooter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
